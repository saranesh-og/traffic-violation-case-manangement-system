<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="redHalo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Night Intersection Background -->
  <rect width="800" height="500" fill="#090d16"/>

  <!-- City Skyline Silhouette -->
  <polygon points="0,260 40,240 80,240 80,210 130,210 130,260 210,260 210,180 260,180 260,260 380,260 440,230 480,230 520,260 620,190 680,190 680,260 800,260 800,500 0,500" fill="#111827"/>

  <!-- Street Roadway -->
  <polygon points="100,280 700,280 800,500 0,500" fill="#1e2430"/>

  <!-- Crosswalk & Stop Bar (Violated by Vehicle) -->
  <rect x="220" y="380" width="360" height="12" fill="#ffffff" opacity="0.9"/>
  <!-- Crosswalk stripes -->
  <rect x="180" y="405" width="40" height="80" fill="#ffffff" opacity="0.4"/>
  <rect x="250" y="405" width="40" height="80" fill="#ffffff" opacity="0.4"/>
  <rect x="320" y="405" width="40" height="80" fill="#ffffff" opacity="0.4"/>
  <rect x="390" y="405" width="40" height="80" fill="#ffffff" opacity="0.4"/>
  <rect x="460" y="405" width="40" height="80" fill="#ffffff" opacity="0.4"/>
  <rect x="530" y="405" width="40" height="80" fill="#ffffff" opacity="0.4"/>

  <!-- Vehicle Entering (Mustang GT Velocity Blue) -->
  <g transform="translate(320, 310)">
    <!-- Shadow -->
    <ellipse cx="80" cy="95" rx="85" ry="14" fill="#000000" opacity="0.8"/>
    <!-- Blue Mustang Body -->
    <path d="M 10,65 C 20,40 50,30 90,30 C 120,30 145,45 155,65 L 160,85 C 160,90 150,92 140,92 L 15,92 C 5,92 5,88 10,85 Z" fill="#1d4ed8"/>
    <!-- Windshield & Windows -->
    <path d="M 35,45 Q 85,32 125,35 L 140,55 L 25,55 Z" fill="#020617"/>
    <!-- Headlights & Taillights -->
    <rect x="15" y="65" width="22" height="8" rx="2" fill="#ef4444" filter="url(#redHalo)"/>
    <rect x="125" y="65" width="22" height="8" rx="2" fill="#ef4444" filter="url(#redHalo)"/>
    <!-- Plate -->
    <rect x="62" y="70" width="45" height="18" rx="2" fill="#ffffff" stroke="#1e293b"/>
    <text x="84" y="83" font-family="monospace" font-weight="bold" font-size="9" fill="#1e293b" text-anchor="middle">6ABC321</text>
  </g>

  <!-- Traffic Signal Mast Arm & Light (Glowing Solid RED) -->
  <g transform="translate(620, 100)">
    <rect x="-15" y="160" width="12" height="240" fill="#475569"/>
    <path d="M -9,160 Q -9,40 -120,40 L -220,40" fill="none" stroke="#475569" stroke-width="10"/>
    
    <!-- Signal Box Overhead -->
    <rect x="-180" y="20" width="40" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Red Light Bulb (Active Glow) -->
    <circle cx="-160" cy="38" r="12" fill="#ef4444" filter="url(#redHalo)"/>
    <circle cx="-160" cy="38" r="7" fill="#ffffff" opacity="0.8"/>
    <!-- Yellow Light Bulb (Off) -->
    <circle cx="-160" cy="65" r="10" fill="#422006"/>
    <!-- Green Light Bulb (Off) -->
    <circle cx="-160" cy="92" r="10" fill="#052e16"/>
  </g>

  <!-- Red-Light Phase Detection Banner -->
  <rect x="250" y="25" width="300" height="45" rx="6" fill="#b91c1c" stroke="#fca5a5" stroke-width="2"/>
  <text x="400" y="44" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">STOP SIGNAL PHASE VIOLATION</text>
  <text x="400" y="61" font-family="monospace" font-weight="bold" font-size="12" fill="#fecaca" text-anchor="middle">RED TIME ELAPSED: +0.82 SECONDS</text>

  <!-- Camera Sensor HUD Overlays -->
  <rect x="20" y="20" width="220" height="120" rx="6" fill="#0f172a" opacity="0.9" stroke="#64748b" stroke-width="1.5"/>
  <text x="32" y="42" font-family="monospace" font-size="10" fill="#38bdf8" font-weight="bold">REDFLEX CAM-301 SF-04</text>
  <text x="32" y="60" font-family="monospace" font-size="10" fill="#e2e8f0">MARKET ST &amp; 4TH ST WB</text>
  <text x="32" y="78" font-family="monospace" font-size="10" fill="#e2e8f0">DATE: 2026-11-12 21:15:30.82</text>
  <text x="32" y="96" font-family="monospace" font-size="10" fill="#fbbf24">AMBER CLEARANCE: 4.20s</text>
  <text x="32" y="114" font-family="monospace" font-size="10" fill="#f87171">ENTRY VELOCITY: 42 MPH</text>
  <text x="32" y="130" font-family="monospace" font-size="9" fill="#4ade80">INDUCTION LOOP 2: TRIGGERED</text>

  <!-- Plate Inspection Zoom -->
  <g transform="translate(560, 360)">
    <rect width="220" height="110" rx="6" fill="#0f172a" opacity="0.92" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="110" y="24" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">AUTOMATED OCR RECOGNITION</text>
    <rect x="25" y="34" width="170" height="45" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="110" y="65" font-family="'Courier New', monospace" font-weight="900" font-size="22" fill="#1e293b" text-anchor="middle" letter-spacing="3">6ABC321</text>
    <text x="110" y="95" font-family="'Segoe UI', sans-serif" font-size="10" fill="#4ade80" font-weight="bold" text-anchor="middle">DMV RECORD: FORD MUSTANG (BLU)</text>
  </g>
</svg>