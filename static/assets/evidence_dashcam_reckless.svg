<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Cruiser Cockpit Dashcam View -->
  <rect width="800" height="500" fill="#0b1120"/>

  <!-- Highway Night Landscape -->
  <polygon points="0,260 800,260 800,500 0,500" fill="#1e2430"/>
  <polygon points="300,260 500,260 800,500 0,500" fill="#171e2c"/>

  <!-- Highway Lanes -->
  <line x1="360" y1="260" x2="200" y2="500" stroke="#facc15" stroke-width="4" stroke-dasharray="20,15"/>
  <line x1="440" y1="260" x2="600" y2="500" stroke="#ffffff" stroke-width="3" stroke-dasharray="15,15"/>

  <!-- Target Vehicle: Honda Civic Type R (weaving rapidly) -->
  <g transform="translate(420, 290) rotate(8)">
    <ellipse cx="40" cy="60" rx="45" ry="10" fill="#000000" opacity="0.8"/>
    <!-- Black Car Body -->
    <path d="M 5,45 C 10,25 25,18 45,18 C 65,18 75,25 80,45 L 82,58 L 2,58 Z" fill="#020617" stroke="#334155"/>
    <!-- Taillights -->
    <rect x="5" y="44" width="14" height="6" fill="#ef4444"/>
    <rect x="65" y="44" width="14" height="6" fill="#ef4444"/>
    <!-- Plate -->
    <rect x="28" y="48" width="28" height="10" fill="#ffffff"/>
    <text x="42" y="56" font-family="monospace" font-size="6" font-weight="bold" fill="#000000" text-anchor="middle">8KLM412</text>
  </g>

  <!-- Target Lock Reticle -->
  <g transform="translate(450, 315)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="-55" y1="0" x2="-40" y2="0" stroke="#ef4444" stroke-width="3"/>
    <line x1="40" y1="0" x2="55" y2="0" stroke="#ef4444" stroke-width="3"/>
    <line x1="0" y1="-55" x2="0" y2="-40" stroke="#ef4444" stroke-width="3"/>
    <line x1="0" y1="40" x2="0" y2="55" stroke="#ef4444" stroke-width="3"/>
    
    <rect x="-65" y="-75" width="130" height="20" rx="3" fill="#ef4444"/>
    <text x="0" y="-61" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">TARGET: 104 MPH</text>
  </g>

  <!-- Police Cruiser In-Car Telemetry HUD -->
  <rect x="25" y="25" width="320" height="135" rx="6" fill="#0f172a" opacity="0.9" stroke="#ef4444" stroke-width="2"/>
  <text x="40" y="50" font-family="monospace" font-size="11" fill="#ef4444" font-weight="bold">CHP BAY AREA CRU-704 DASHCAM</text>
  <text x="40" y="70" font-family="monospace" font-size="10" fill="#ffffff">DATE: 2026-11-08 17:22:15 PST</text>
  <text x="40" y="88" font-family="monospace" font-size="10" fill="#f87171">PATROL SPEED: 95 MPH | EMERGENCY BEACONS: ON</text>
  <text x="40" y="106" font-family="monospace" font-size="10" fill="#fca5a5">TARGET VEHICLE: 104 MPH (LIMIT 65 MPH)</text>
  <text x="40" y="124" font-family="monospace" font-size="10" fill="#fbbf24">RADAR LOCK: LIDAR-PL-402 (PULSE TECH)</text>
  <text x="40" y="142" font-family="monospace" font-size="9" fill="#94a3b8">INCIDENT CODE: VC-23103 (RECKLESS DRIVING)</text>

  <!-- Dashcam Timestamp Lower Right -->
  <rect x="580" y="440" width="195" height="35" rx="4" fill="#000000" opacity="0.8"/>
  <text x="677" y="462" font-family="monospace" font-weight="bold" font-size="12" fill="#22c55e" text-anchor="middle">REC [●] 2026-11-08 17:22</text>
</svg>