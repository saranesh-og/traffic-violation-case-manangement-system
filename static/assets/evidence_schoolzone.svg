<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Daytime School Zone Background -->
  <rect width="800" height="260" fill="#e0f2fe"/>
  <rect y="260" width="800" height="240" fill="#334155"/>

  <!-- School Building in Background -->
  <rect x="80" y="140" width="220" height="120" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <polygon points="60,140 190,80 320,140" fill="#991b1b"/>
  <rect x="160" y="190" width="60" height="70" fill="#f8fafc"/>
  <text x="190" y="130" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">LINCOLN ELEMENTARY</text>

  <!-- School Zone Flashing Sign Post -->
  <g transform="translate(420, 100)">
    <rect x="8" y="0" width="10" height="280" fill="#64748b"/>
    <!-- Yellow Sign -->
    <rect x="-40" y="30" width="110" height="100" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="15" y="55" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14" fill="#854d0e" text-anchor="middle">SCHOOL</text>
    <text x="15" y="75" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#854d0e" text-anchor="middle">SPEED LIMIT</text>
    <text x="15" y="110" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#854d0e" text-anchor="middle">25</text>
    <!-- Amber Flashing Beacons -->
    <circle cx="15" cy="15" r="10" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="15" cy="15" r="5" fill="#fef08a"/>
    <circle cx="15" cy="145" r="10" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="15" cy="145" r="5" fill="#fef08a"/>
  </g>

  <!-- Target Vehicle: Toyota RAV4 Super White -->
  <g transform="translate(560, 280)">
    <ellipse cx="60" cy="80" rx="65" ry="12" fill="#000000" opacity="0.6"/>
    <!-- White SUV Body -->
    <path d="M 5,60 C 10,35 30,25 70,25 C 100,25 115,35 120,60 L 125,75 L 0,75 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 25,35 L 55,30 L 95,30 L 110,48 L 18,48 Z" fill="#0f172a"/>
    <rect x="45" y="55" width="35" height="15" fill="#e2e8f0" stroke="#0f172a"/>
    <text x="62" y="66" font-family="monospace" font-size="8" font-weight="bold" fill="#000000" text-anchor="middle">5TYP903</text>
  </g>

  <!-- Lidar Scope Measurement Overlay -->
  <rect x="25" y="25" width="280" height="95" rx="6" fill="#0f172a" opacity="0.9" stroke="#eab308" stroke-width="2"/>
  <text x="35" y="45" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#eab308">LIDAR TRUSPEED-09 TELEMETRY</text>
  <text x="35" y="65" font-family="monospace" font-size="10" fill="#ffffff">TARGET SPEED: 44 MPH</text>
  <text x="35" y="80" font-family="monospace" font-size="10" fill="#ffffff">POSTED SCHOOL LIMIT: 25 MPH (+19 MPH)</text>
  <text x="35" y="95" font-family="monospace" font-size="9" fill="#4ade80">BEACONS ACTIVE: 14:00 - 15:30</text>
  <text x="35" y="110" font-family="monospace" font-size="9" fill="#cbd5e1">TIME OF CAPTURE: 14:40:02 PST</text>
</svg>