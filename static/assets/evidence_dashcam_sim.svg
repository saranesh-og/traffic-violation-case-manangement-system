<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Video Player Simulation Container -->
  <rect width="800" height="500" fill="#090d16"/>

  <!-- Grid / Wireframe Video Scene -->
  <g opacity="0.15">
    <line x1="0" y1="250" x2="800" y2="250" stroke="#38bdf8" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="400" cy="250" r="100" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="400" cy="250" r="200" fill="none" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Intersection Geometric Map & Vehicle Trajectory -->
  <g transform="translate(400, 240)">
    <!-- North-South Street -->
    <rect x="-60" y="-180" width="120" height="360" fill="#1e293b"/>
    <!-- East-West Street -->
    <rect x="-300" y="-60" width="600" height="120" fill="#1e293b"/>
    <!-- Intersection Box -->
    <rect x="-60" y="-60" width="120" height="120" fill="#0f172a" stroke="#475569" stroke-width="2"/>

    <!-- Stop lines -->
    <rect x="-60" y="60" width="120" height="6" fill="#ffffff"/>
    <rect x="-60" y="-66" width="120" height="6" fill="#ffffff"/>
    <rect x="-66" y="-60" width="6" height="120" fill="#ffffff"/>
    <rect x="60" y="-60" width="6" height="120" fill="#ffffff"/>

    <!-- Path / Trajectory of Red-light violator -->
    <path d="M -260,20 L 260,20" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="10,6"/>
    <!-- Car Point -->
    <circle cx="-10" cy="20" r="12" fill="#ef4444"/>
    <circle cx="-10" cy="20" r="20" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
    <text x="-10" y="-5" font-family="monospace" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">MUSTANG 6ABC321</text>
    <text x="-10" y="45" font-family="monospace" font-size="10" fill="#fca5a5" text-anchor="middle">T + 0.82s RED</text>

    <!-- Signal indicator -->
    <circle cx="45" cy="45" r="8" fill="#ef4444"/>
    <text x="60" y="50" font-family="monospace" font-size="9" fill="#ef4444">SIGNAL: RED</text>
  </g>

  <!-- Video Playback Bar Overlay (Simulating Video Player) -->
  <rect x="0" y="440" width="800" height="60" fill="#0f172a" opacity="0.95"/>
  <!-- Progress track -->
  <rect x="20" y="452" width="760" height="6" rx="3" fill="#334155"/>
  <rect x="20" y="452" width="480" height="6" rx="3" fill="#38bdf8"/>
  <circle cx="500" cy="455" r="8" fill="#ffffff"/>

  <!-- Controls -->
  <polygon points="40,475 52,483 40,491" fill="#38bdf8"/>
  <text x="70" y="486" font-family="monospace" font-size="11" fill="#cbd5e1">00:06.82 / 00:10.00</text>
  <text x="400" y="486" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#38bdf8" text-anchor="middle">EVENT MARKER: STOP LINE BREACH (+0.82s)</text>
  <text x="740" y="486" font-family="monospace" font-size="11" fill="#94a3b8">30 FPS HD</text>

  <!-- Top Video Metadata Banner -->
  <rect x="20" y="20" width="340" height="65" rx="6" fill="#0f172a" opacity="0.9" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="32" y="40" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#38bdf8">HD SENSOR SYNC REPLAY - 1080P</text>
  <text x="32" y="56" font-family="monospace" font-size="10" fill="#e2e8f0">CAM ID: REDFLEX-CAM-301 (SF-04)</text>
  <text x="32" y="72" font-family="monospace" font-size="10" fill="#94a3b8">TIMESTAMP: 2026-11-12 21:15:28 - 21:15:38</text>
</svg>