<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Scene Background: Intersection Corner -->
  <rect width="800" height="300" fill="#cbd5e1"/>
  <rect y="300" width="800" height="200" fill="#475569"/>
  <!-- Sidewalk -->
  <rect y="260" width="800" height="50" fill="#94a3b8"/>

  <!-- Metal Pole for Sign -->
  <rect x="380" y="80" width="12" height="220" fill="#64748b"/>

  <!-- "No U-Turn" Sign Behind Branches -->
  <g transform="translate(340, 90)">
    <rect width="90" height="90" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="4"/>
    <circle cx="45" cy="45" r="32" fill="none" stroke="#dc2626" stroke-width="6"/>
    <!-- U-Turn arrow -->
    <path d="M 32,58 L 32,38 C 32,28 58,28 58,38 L 58,58" fill="none" stroke="#0f172a" stroke-width="6"/>
    <polygon points="26,52 32,64 38,52" fill="#0f172a"/>
    <!-- Slash across -->
    <line x1="22" y1="22" x2="68" y2="68" stroke="#dc2626" stroke-width="6"/>
  </g>

  <!-- Heavy Overgrown Tree Foliage Completely Obscuring Sign -->
  <g transform="translate(250, 40)">
    <!-- Tree Trunk -->
    <rect x="20" y="100" width="40" height="180" fill="#78350f"/>
    <!-- Large Dense Green Leaves Clustered over the sign -->
    <ellipse cx="60" cy="80" rx="90" ry="70" fill="#15803d" opacity="0.95"/>
    <ellipse cx="120" cy="110" rx="80" ry="60" fill="#166534" opacity="0.95"/>
    <ellipse cx="140" cy="70" rx="70" ry="50" fill="#14532d" opacity="0.95"/>
    <ellipse cx="90" cy="130" rx="85" ry="55" fill="#15803d" opacity="0.98"/>
    <!-- Overhang covering 85% of the sign -->
    <circle cx="110" cy="95" r="50" fill="#16a34a" opacity="0.9"/>
  </g>

  <!-- Forensic Measurement Indicator Lines -->
  <line x1="260" y1="220" x2="385" y2="135" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="80" y="220" width="260" height="50" rx="4" fill="#0f172a" opacity="0.9" stroke="#ef4444" stroke-width="1.5"/>
  <text x="90" y="240" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ef4444">FOLIAGE OBSTRUCTION ANALYSIS</text>
  <text x="90" y="258" font-family="monospace" font-size="10" fill="#ffffff">VISIBILITY: 15% (85% IMPAIRED)</text>

  <!-- Public Works Work Order Tag -->
  <rect x="480" y="40" width="290" height="110" rx="6" fill="#0f172a" opacity="0.95" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="495" y="65" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#f59e0b">PUBLIC WORKS CORROBORATING RECORD</text>
  <text x="495" y="85" font-family="monospace" font-size="10" fill="#ffffff">TICKET #PW-8812 (HAZARD TREE TRIM)</text>
  <text x="495" y="103" font-family="monospace" font-size="10" fill="#94a3b8">CORNER: GRAND AVE &amp; PINE ST</text>
  <text x="495" y="122" font-family="monospace" font-size="10" fill="#4ade80">FINDING: SIGN UNVIEWABLE FROM 50M</text>
  <text x="495" y="138" font-family="monospace" font-size="9" fill="#f87171">LEGAL BASIS: MUTCD SEC 2A.08 DEFECT</text>
</svg>